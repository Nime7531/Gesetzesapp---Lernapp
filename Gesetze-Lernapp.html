<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gesetze-Lernapp</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#e2e0d8;--ac:#1f4e79;--acf:#fff;--hl:#ffe58a;--st:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ecebe6;--mut:#9a9a94;--card:#202024;--bd:#34343a;--ac:#7fb2e5;--acf:#10161c;--hl:#6b5a14;--st:#2b2616}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ecebe6;--mut:#9a9a94;--card:#202024;--bd:#34343a;--ac:#7fb2e5;--acf:#10161c;--hl:#6b5a14;--st:#2b2616}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:5}
main{max-width:820px;margin:0 auto;padding:16px}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--acf);border-color:var(--ac)}
button.on{background:var(--ac);color:var(--acf)}
input[type=search]{flex:1;min-width:140px}
.para{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:0 0 12px}
.para.star{background:var(--st)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.txt{white-space:pre-wrap;user-select:text}
mark{background:var(--hl);color:inherit;border-radius:3px;cursor:pointer}
.mut{color:var(--mut);font-size:14px}
#hb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;z-index:9;box-shadow:0 4px 16px #0004;padding:10px 20px}
#md{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#md>div{background:var(--bg);border-radius:12px;padding:16px;width:min(640px,100%);display:flex;flex-direction:column;gap:8px}
#md textarea{height:260px;width:100%;box-sizing:border-box}
.sl{margin:0 0 16px}.sl li{margin:4px 0}
@media print{header,#hb,.noprint{display:none!important}body{background:#fff;color:#000}.para{border:0;background:#fff}mark{background:#ffe58a}}
</style></head><body>
<header>
<select id="ls" aria-label="Gesetz"></select>
<button id="add">+ Gesetz</button>
<button id="vr">Lesen</button><button id="vs">Übersicht</button>
<input type="search" id="q" placeholder="Suche: § 15, Betriebsausgabe …">
<button id="bk" title="Sicherung">Backup</button>
</header>
<main id="m"></main>
<button id="hb" class="p">Auswahl markieren</button>
<div id="md"><div><b id="mt"></b><input id="mn" placeholder="Name, z. B. EStG"><textarea id="mx"></textarea><div class="mut" id="me"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button id="mc">Abbrechen</button><button class="p" id="mo">OK</button></div></div></div>
<script>
const K='gesetzeapp.v1';let S={laws:[],marks:{}};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Speicher voll – bitte Backup kopieren und ein Gesetz entfernen.')}};
const $=s=>document.querySelector(s);
let cur=S.laws[0]&&S.laws[0].id,view='read',q='',lim=60,pend=null,mode='',delArm=false;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const law=()=>S.laws.find(l=>l.id===cur);
const getM=(l,k)=>{const a=S.marks[l.id]||(S.marks[l.id]={});return a[k]||(a[k]={star:false,hl:[]})};
function parse(t){const re=/^\s*(§§?|Art\.?|Artikel)\s*(\d+[a-z]?)\b/,out=[];let c=null;
for(const l of t.replace(/\r/g,'').split('\n')){const m=l.match(re);if(m){c={key:m[1]+' '+m[2],lines:[l.trim()]};out.push(c)}else if(c)c.lines.push(l)}
return out.map(p=>({key:p.key,text:p.lines.join('\n').trim()}))}
function paraEl(l,p){
const m=(S.marks[l.id]||{})[p.key]||{star:false,hl:[]};
const d=el('div','para'+(m.star?' star':''));d.dataset.k=p.key;
const h=el('div','ph');h.append(el('b',null,p.key));
const b=el('button',null,m.star?'★ gemerkt':'☆ merken');
b.onclick=()=>{const mm=getM(l,p.key);mm.star=!mm.star;save();draw()};h.append(b);
const t=el('div','txt');let pos=0;
[...m.hl].sort((a,b)=>a[0]-b[0]).forEach(([s,e])=>{
if(s>pos)t.append(p.text.slice(pos,s));
const k=el('mark',null,p.text.slice(s,e));k.title='Klicken zum Entfernen';
k.onclick=()=>{const mm=getM(l,p.key);mm.hl=mm.hl.filter(x=>!(x[0]===s&&x[1]===e));save();draw()};
t.append(k);pos=e});
t.append(p.text.slice(pos));d.append(h,t);return d}
function sumText(l){const mk=S.marks[l.id]||{};let o='## '+l.name+'\n';
for(const p of l.paras){const m=mk[p.key];if(!m||(!m.star&&!m.hl.length))continue;
o+='\n### '+p.key+'\n';
if(m.hl.length)[...m.hl].sort((a,b)=>a[0]-b[0]).forEach(([s,e])=>o+='- '+p.text.slice(s,e).replace(/\s+/g,' ').trim()+'\n');
else o+=p.text+'\n'}
return o}
function draw(){
const y=scrollY,m=$('#m');m.replaceChildren();
const ls=$('#ls');ls.replaceChildren();S.laws.forEach(l=>{const o=el('option',null,l.name);o.value=l.id;ls.append(o)});if(cur)ls.value=cur;
$('#vr').className=view==='read'?'on':'';$('#vs').className=view==='sum'?'on':'';
if(!S.laws.length){const d=el('div','para');
d.append(el('b',null,'Willkommen!'),el('p',null,'Klicke auf „+ Gesetz“ und füge den Volltext eines Gesetzes ein (z. B. von gesetze-im-internet.de: Gesetz öffnen, Text kopieren). Die App teilt ihn automatisch in Paragrafen. Danach kannst du Text markieren, ganze § merken und dir die Übersicht ansehen.'));
m.append(d);return}
if(view==='read'){const l=law();if(!l)return;
const f=l.paras.filter(p=>!q||p.key.toLowerCase().includes(q)||p.text.toLowerCase().includes(q));
const bar=el('div','mut noprint',f.length+' von '+l.paras.length+' Abschnitten · Text markieren und unten auf „Auswahl markieren“ tippen');bar.style.marginBottom='10px';m.append(bar);
f.slice(0,lim).forEach(p=>m.append(paraEl(l,p)));
if(f.length>lim){const b=el('button',null,'Mehr anzeigen');b.onclick=()=>{lim+=60;draw()};m.append(b)}
const dl=el('button','noprint',delArm?'Wirklich löschen?':'Dieses Gesetz entfernen');dl.style.cssText='display:block;margin-top:24px';
dl.onclick=()=>{if(!delArm){delArm=true;draw();return}
S.laws=S.laws.filter(x=>x.id!==cur);delete S.marks[cur];cur=S.laws[0]&&S.laws[0].id;delArm=false;save();draw()};m.append(dl)}
else{const bar=el('div','noprint');bar.style.cssText='display:flex;gap:8px;margin-bottom:12px';
const c=el('button','p','Übersicht kopieren');c.onclick=()=>{const t=S.laws.map(sumText).join('\n');navigator.clipboard.writeText(t).then(()=>{c.textContent='Kopiert ✓'},()=>{c.textContent='Kopieren nicht möglich'})};
const pr=el('button',null,'Drucken');pr.onclick=()=>print();bar.append(c,pr);m.append(bar);
let any=false;
for(const l of S.laws){const mk=S.marks[l.id]||{};const ps=l.paras.filter(p=>mk[p.key]&&(mk[p.key].star||mk[p.key].hl.length));
if(!ps.length)continue;any=true;m.append(el('h2',null,l.name+' ('+ps.length+' §)'));
const ul=el('ul','sl');
for(const p of ps){const mm=mk[p.key],li=el('li');li.append(el('b',null,p.key));
const first=p.text.split('\n')[0].replace(p.key,'').trim();if(first)li.append(' '+first.slice(0,80));
if(mm.hl.length){const u=el('ul');[...mm.hl].sort((a,b)=>a[0]-b[0]).forEach(([s,e])=>{u.append(el('li',null,'„'+p.text.slice(s,e).replace(/\s+/g,' ').trim()+'“'))});li.append(u)}
else li.append(el('span','mut',' – ganzer Paragraf gemerkt'));ul.append(li)}
m.append(ul)}
if(!any)m.append(el('p','mut','Noch nichts markiert.'))}
scrollTo(0,y)}
document.addEventListener('selectionchange',()=>{
const s=getSelection();pend=null;
if(s.rangeCount&&!s.isCollapsed){const r=s.getRangeAt(0);
const f=x=>(x.nodeType===1?x:x.parentElement).closest('.txt');const a=f(r.startContainer),b=f(r.endContainer);
if(a&&a===b){const pr=document.createRange();pr.selectNodeContents(a);pr.setEnd(r.startContainer,r.startOffset);
const st=pr.toString().length;pend={k:a.parentElement.dataset.k,s:st,e:st+r.toString().length}}}
$('#hb').style.display=pend?'block':'none'});
$('#hb').onpointerdown=e=>e.preventDefault();
$('#hb').onclick=()=>{if(!pend)return;const l=law(),mm=getM(l,pend.k);let{s,e}=pend;const keep=[];
for(const[a,b]of mm.hl){if(b<s||a>e)keep.push([a,b]);else{s=Math.min(s,a);e=Math.max(e,b)}}
keep.push([s,e]);mm.hl=keep;save();getSelection().removeAllRanges();draw()};
function modal(m){mode=m;$('#md').style.display='flex';$('#me').textContent='';
const add=m==='add';$('#mn').style.display=add?'block':'none';
$('#mt').textContent=add?'Gesetz hinzufügen':'Backup (kopieren zum Sichern, einfügen zum Einspielen)';
$('#mx').value=add?'':JSON.stringify(S);$('#mx').placeholder=add?'Gesetzestext hier einfügen …':'';
$('#mo').textContent=add?'Hinzufügen':'Einspielen'}
$('#add').onclick=()=>modal('add');$('#bk').onclick=()=>modal('bk');
$('#mc').onclick=()=>{$('#md').style.display='none'};
$('#mo').onclick=()=>{
if(mode==='add'){const n=$('#mn').value.trim(),ps=parse($('#mx').value);
if(!n||!ps.length){$('#me').textContent='Bitte Name eingeben und Text mit Zeilen wie „§ 1 …“ einfügen.';return}
const id='l'+Date.now();S.laws.push({id,name:n,paras:ps});cur=id;view='read';q='';lim=60;$('#q').value=''}
else{try{const o=JSON.parse($('#mx').value);if(!Array.isArray(o.laws))throw 0;S=o;cur=S.laws[0]&&S.laws[0].id}catch(e){$('#me').textContent='Das ist kein gültiges Backup.';return}}
save();$('#md').style.display='none';draw()};
$('#ls').onchange=e=>{cur=e.target.value;delArm=false;lim=60;draw()};
$('#vr').onclick=()=>{view='read';draw()};$('#vs').onclick=()=>{view='sum';draw()};
$('#q').oninput=e=>{q=e.target.value.toLowerCase().trim();lim=60;view='read';draw()};
draw();
</script></body></html>
